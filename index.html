<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi em - Cô gái ngày 20/10</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #fce4ec;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px 0;
        }

        /* Container thiệp */
        .card-container {
            background: #fffdf9;
            width: 90%;
            max-width: 450px;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(224, 64, 129, 0.2);
            border: 2px solid #f8bbd0;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        /* Khung ảnh */
        .photo-frame {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding: 8px;
            background: linear-gradient(135deg, #f48fb1, #f06292);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fff;
        }

        /* Tiêu đề & Lời chúc */
        h1 {
            color: #c2185b;
            font-size: 1.5rem;
            margin-bottom: 15px;
            font-family: 'Dancing Script', cursive, sans-serif;
        }

        .greeting-text {
            color: #4a4a4a;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 20px;
            background: #fff5f8;
            padding: 15px;
            border-radius: 12px;
            border-left: 4px solid #f48fb1;
            text-align: left;
        }

        .heart-icon {
            color: #e91e63;
            font-size: 1.2rem;
            animation: beat 1s infinite alternate;
            display: inline-block;
        }

        @keyframes beat {
            to { transform: scale(1.2); }
        }

        /* Hiệu ứng hoa rơi */
        .petal {
            position: fixed;
            top: -10%;
            user-select: none;
            z-index: 1;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                opacity: 1;
                top: -10%;
                transform: translateX(0) rotate(0deg);
            }
            100% {
                opacity: 0.2;
                top: 105%;
                transform: translateX(100px) rotate(360deg);
            }
        }

        /* Nút nhạc */
        .music-btn {
            background: #e91e63;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(233, 30, 99, 0.3);
            transition: all 0.3s ease;
        }

        .music-btn:hover {
            background: #c2185b;
            transform: scale(1.05);
        }
    </style>
    <!-- Font chữ lãng mạn -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="card-container">
        <!-- Thay link ảnh của bạn vào thuộc tính src dưới đây -->
        <div class="photo-frame">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=500" alt="Cô gái ngày 20/10">
        </div>

        <h1>Gửi em – Cô gái của ngày 20/10 <span class="heart-icon">♥</span></h1>

        <div class="greeting-text">
            <p>🌸 <b>Chúc em ngày 20/10 thật hạnh phúc</b>, luôn xinh đẹp, bình yên và tràn ngập yêu thương.</p>
            <br>
            <p>Mong những ngày phía trước sẽ dịu dàng với em, nụ cười luôn ở lại trên môi và mọi điều tốt đẹp nhất sẽ luôn tìm đến bên em.</p>
            <br>
            <p style="text-align: center; font-weight: bold; color: #c2185b;">
                Yêu em và cuộc đời, hôm nay và mãi mãi! <br> 20/10/2026
            </p>
        </div>

        <button class="music-btn" onclick="togglePlay()">🎵 Bật / Tắt Nhạc</button>
    </div>

    <!-- Nhạc nền lãng mạn -->
    <audio id="bg-music" loop>
        <source src="https://assets.mixkit.co/music/preview/mixkit-romantic-sun-683.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Tạo hiệu ứng cánh hoa rơi
        function createPetal() {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            
            // Các biểu tượng hoa
            const flowers = ['🌸', '🌺', '🌹', '✨', '💖'];
            petal.innerText = flowers[Math.floor(Math.random() * flowers.length)];
            
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.animationDuration = Math.random() * 3 + 4 + 's'; // 4 - 7s
            petal.style.fontSize = Math.random() * 10 + 15 + 'px'; // 15 - 25px
            
            document.body.appendChild(petal);

            setTimeout(() => {
                petal.remove();
            }, 7000);
        }

        setInterval(createPetal, 300);

        // Phát nhạc
        const music = document.getElementById('bg-music');
        function togglePlay() {
            if (music.paused) {
                music.play();
            } else {
                music.pause();
            }
        }
    </script>
</body>
</html>
